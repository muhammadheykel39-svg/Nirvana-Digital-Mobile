name: nirvana_mobile
description: Nirvana Digital Mobile - Engineering Department Inspection App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.0.5
  get: ^4.6.5
  
  # Network & API
  dio: ^5.3.2
  http: ^1.1.0
  
  # Local Storage (Offline Support)
  shared_preferences: ^2.2.0
  sqflite: ^2.3.0
  path_provider: ^2.1.0
  
  # QR Code Scanner
  mobile_scanner: ^3.4.1
  
  # Export to PDF/Excel
  pdf: ^3.10.4
  printing: ^5.11.0
  excel: ^4.0.2
  path: ^1.8.3
  
  # Encryption & Security
  encrypt: ^5.0.3
  flutter_secure_storage: ^9.0.0
  
  # Date & Time
  intl: ^0.18.1
  
  # UI Components
  flutter_slidable: ^3.0.0
  pull_to_refresh: ^2.0.0
  shimmer: ^3.0.0
  
  # Connectivity Check
  connectivity_plus: ^5.0.1
  
  # Image Picker (for evidence photos)
  image_picker: ^1.0.4
  
  # Form Validation
  form_field_validator: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mockito: ^5.4.2
  build_runner: ^2.4.6

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
  
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
